<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction harness</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <style>
      body {
        background: #0e1a24;
        color: #e8e4da;
        font:
          16px/1.5 system-ui,
          sans-serif;
        padding: 32px;
        max-width: 900px;
        margin: auto;
      }
      p,
      label {
        color: #9aabb5;
      }
      input,
      button {
        font: inherit;
        min-height: 32px;
      }
      input[type='number'] {
        width: 5em;
      }
      button {
        padding: 4px 16px;
        border-radius: 6px;
        border: 1px solid #7fb7c9;
        background: #16293a;
        color: #e8e4da;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid #7fb7c9;
        outline-offset: 2px;
      }
      pre {
        background: #16293a;
        padding: 12px;
        white-space: pre-wrap;
        font-size: 14px;
      }
      canvas {
        background: #000;
        width: 100%;
        max-width: 640px;
      }
      a {
        color: #7fb7c9;
      }
    </style>
  </head>
  <body>
    <h1>Signature extraction</h1>
    <p>
      Developer page for automated tests (<code>window.spExtract</code>) and for trying real clips.
      Pick a clip, optionally box a focus area (0–1 of the frame as displayed), and extract. The
      drawing shows each cell's strongest movement, never the clip itself.
    </p>
    <p>
      <input id="file" type="file" accept="video/*,.mov,.mp4,.webm" aria-label="Clip" />
    </p>
    <p>
      <label><input id="use-focus" type="checkbox" /> Focus area</label>
      <label>x <input id="fx" type="number" step="0.01" min="0" max="1" value="0.25" /></label>
      <label>y <input id="fy" type="number" step="0.01" min="0" max="1" value="0.25" /></label>
      <label>w <input id="fw" type="number" step="0.01" min="0" max="1" value="0.5" /></label>
      <label>h <input id="fh" type="number" step="0.01" min="0" max="1" value="0.5" /></label>
    </p>
    <p><button id="extract" type="button">Extract signature</button></p>
    <p id="status" aria-live="polite"></p>
    <pre id="summary"></pre>
    <canvas id="field" width="640" height="360"></canvas>
    <p><a href="../">All harness pages</a></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
